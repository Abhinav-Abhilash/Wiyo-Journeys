<!-- Brand & Identity Header -->
<header class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative flex items-center justify-center w-20 h-20 rounded-xl bg-surface-container-lowest shadow-sm mb-space-sm p-space-xs">
<img alt="Wiyo Journeys Logo" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1WyN5GdYQ0yU4nPvPOh8ae1UT3RxV7cbb13JPLC7TGQvyJWt2DDACKcrIi-HP9-v3zWoKcur9pmnImppaWE5EYav3yaVFoKCmJuqg20pPckBrO_f1irWx-YXv9kLOo4jHOq2JfaoXI0cEQk02VXwidRlQpTVsvTsclWECFHfL9q9tXT4OWUMBa5_UfGmkvcIqQn-4zF2z5eH8jRbpG7eJEIgZjBUkC8d0OE0FNmQExSpoyVuGdEjPQiGQE"/>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Wiyo Journeys</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 max-w-xs">
      Your journey, made simple. • യാത്രകൾ ഇനി ലളിതം
    </p>
</header>
<!-- Title & Selection Prompt -->
<div class="flex flex-col text-center mb-space-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Choose your language</h2>
<p class="font-label-md text-label-md text-primary font-semibold mt-0.5">നിങ്ങളുടെ ഭാഷ തിരഞ്ഞെടുക്കുക</p>
</div>
<!-- Language Selection Cards -->
<section aria-label="Language selection options" class="flex flex-col gap-space-md w-full" id="language-list">
<!-- Option 1: English (Selected by default) -->
<button class="lang-card group relative w-full text-left p-space-lg rounded-xl transition-all duration-200 bg-primary text-on-primary shadow-md flex items-center justify-between cursor-pointer active:scale-[0.98]" data-lang="en" type="button">
<div class="flex flex-col min-w-0 pr-space-md">
<div class="flex items-center gap-space-sm">
<span class="font-title-lg text-title-lg font-bold">English</span>
<span class="lang-badge inline-flex items-center px-space-xs py-0.5 rounded-full font-label-sm text-label-sm bg-primary-fixed text-on-primary-fixed font-semibold">Default</span>
</div>
<p class="lang-subtext font-body-md text-body-md text-primary-fixed opacity-95 mt-1 line-clamp-1">
          Hello! Plan your bus journey with ease.
        </p>
</div>
<div class="lang-check flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option 2: Malayalam -->
<button class="lang-card group relative w-full text-left p-space-lg rounded-xl transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container-low flex items-center justify-between cursor-pointer active:scale-[0.98]" data-lang="ml" type="button">
<div class="flex flex-col min-w-0 pr-space-md">
<div class="flex items-center gap-space-sm">
<span class="font-title-lg text-title-lg font-bold">മലയാളം</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Malayalam</span>
</div>
<p class="lang-subtext font-body-md text-body-md text-on-surface-variant mt-1 line-clamp-1">
          കേരളത്തിലെ ബസ് യാത്രകൾ എളുപ്പമാക്കൂ
        </p>
</div>
<div class="lang-check hidden flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-lowest text-primary items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option 3: Tamil -->
<button class="lang-card group relative w-full text-left p-space-lg rounded-xl transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container-low flex items-center justify-between cursor-pointer active:scale-[0.98]" data-lang="ta" type="button">
<div class="flex flex-col min-w-0 pr-space-md">
<div class="flex items-center gap-space-sm">
<span class="font-title-lg text-title-lg font-bold">தமிழ்</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Tamil</span>
</div>
<p class="lang-subtext font-body-md text-body-md text-on-surface-variant mt-1 line-clamp-1">
          உங்கள் பேருந்து பயணத்தை எளிதாக்குங்கள்
        </p>
</div>
<div class="lang-check hidden flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-lowest text-primary items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option 4: Hindi -->
<button class="lang-card group relative w-full text-left p-space-lg rounded-xl transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm hover:bg-surface-container-low flex items-center justify-between cursor-pointer active:scale-[0.98]" data-lang="hi" type="button">
<div class="flex flex-col min-w-0 pr-space-md">
<div class="flex items-center gap-space-sm">
<span class="font-title-lg text-title-lg font-bold">हिंदी</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Hindi</span>
</div>
<p class="lang-subtext font-body-md text-body-md text-on-surface-variant mt-1 line-clamp-1">
          सरल और सुगम बस यात्रा
        </p>
</div>
<div class="lang-check hidden flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-lowest text-primary items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</section>
<!-- Bottom Action & Delightful Reassurances -->
<div class="flex flex-col w-full mt-space-xl gap-space-md">
<button class="w-full min-h-[52px] bg-primary hover:bg-primary-container text-on-primary font-title-md text-title-md rounded-xl shadow-md flex items-center justify-center gap-space-xs transition-transform active:scale-[0.98] cursor-pointer" id="continue-btn" type="button">
<span id="continue-text">Continue • തുടർന്ന് പോകുക</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Clean Offline & Trust Note -->
<div class="flex items-center justify-center gap-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-md text-label-md">No signup required • Works offline</span>
</div>
</div>
</div>
<script>
  (function () {
    const cards = document.querySelectorAll('.lang-card');
    const continueText = document.getElementById('continue-text');

    const buttonLabels = {
      en: 'Continue \u2022 തുടർന്ന് പോകുക',
      ml: 'തുടരുക \u2022 Continue',
      ta: 'தொடரவும் \u2022 Continue',
      hi: 'आगे बढ़ें \u2022 Continue'
    };

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        const lang = card.getAttribute('data-lang');

        // Reset all cards
        cards.forEach((c) => {
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
          c.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');

          const subtext = c.querySelector('.lang-subtext');
          if (subtext) {
            subtext.classList.remove('text-primary-fixed', 'opacity-95');
            subtext.classList.add('text-on-surface-variant');
          }

          const badge = c.querySelector('.lang-badge');
          if (badge) badge.remove();

          const check = c.querySelector('.lang-check');
          if (check) {
            check.classList.add('hidden');
            check.classList.remove('flex');
          }
        });

        // Activate clicked card
        card.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
        card.classList.add('bg-primary', 'text-on-primary', 'shadow-md');

        const activeSubtext = card.querySelector('.lang-subtext');
        if (activeSubtext) {
          activeSubtext.classList.remove('text-on-surface-variant');
          activeSubtext.classList.add('text-primary-fixed', 'opacity-95');
        }

        const activeCheck = card.querySelector('.lang-check');
        if (activeCheck) {
          activeCheck.classList.remove('hidden');
          activeCheck.classList.add('flex');
        }

        if (buttonLabels[lang]) {
          continueText.textContent = buttonLabels[lang];
        }
      });
    });
  })();
</script></main></body></html>
